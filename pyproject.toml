[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-asteroid-encounters"
version = "0.1.0"
description = "Catalog of close asteroid encounters during the Gaia DR3 observation period"
requires-python = ">=3.11"
dependencies = [
    # Astronomía
    "astropy>=6.0",
    "astroquery>=0.4.7",
    # Numérico
    "numpy>=1.26",
    "scipy>=1.12",
    # Datos a escala
    "polars>=0.20",
    "duckdb>=0.10",
    # Propagación orbital (N-cuerpos)
    "rebound>=4.0",
    # Visualización
    "plotly>=5.0",
    "streamlit>=1.30",
    # Infraestructura
    "rich>=13.0",
    "tqdm>=4.0",
    "pyyaml>=6.0",
    "dask>=2024.1",
    # Compressed chunked storage for the bulk N-body trajectory cache.
    # Zarr v2 is stable; numcodecs supplies the Blosc compressor with the
    # bitshuffle filter that we use for float32 trajectories (~5× ratio).
    "zarr>=2.16,<3",
    "numcodecs>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.9",
    "debugpy>=1.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

# -----------------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# -----------------------------------------------------------------------------
# Black
# -----------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# -----------------------------------------------------------------------------
# Mypy
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow integration tests requiring REBOUND (deselect with -m 'not slow')",
]

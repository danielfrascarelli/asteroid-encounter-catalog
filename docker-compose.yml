services:

  # ── Pipeline runner ──────────────────────────────────────────────────────────
  # Uso: docker compose run --rm pipeline python -m scripts.run_pipeline
  pipeline:
    build: .
    image: gaia-asteroid-encounters
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
      # config.local.yaml opcional para overrides locales (gitignored).
      # Si no existe, créalo antes de correr: cp config.yaml config.local.yaml
      - ./config.local.yaml:/app/config.local.yaml:ro
      # Para usar otras variantes de config (ej. config_005au.yaml), añadirlas
      # aquí (el archivo debe existir antes) o pasarlas en el comando:
      #   docker compose run --rm \
      #     -v ./config_005au.yaml:/app/config_005au.yaml:ro \
      #     pipeline python -m scripts.run_pipeline --config config_005au.yaml
      # Montar código fuente para que cambios sean visibles sin rebuild
      - ./src:/app/src
      - ./scripts:/app/scripts
    # Sin command: usa el CMD del Dockerfile (run_pipeline con config.yaml)
    # Sobreescribir en CLI: docker compose run --rm pipeline python -m scripts.X

  # ── Dashboard interactivo ────────────────────────────────────────────────────
  # Uso: docker compose up dashboard
  dashboard:
    image: gaia-asteroid-encounters  # reutiliza la imagen ya construida por pipeline
    command: streamlit run src/dashboard/app.py --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    # dashboard requiere que data/output/ tenga un catálogo generado previamente

  # ── Tests ────────────────────────────────────────────────────────────────────
  # Uso: docker compose run --rm test
  test:
    image: gaia-asteroid-encounters  # reutiliza la imagen ya construida por pipeline
    command: pytest tests/ -v
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      # Mount source + tests so edits show up without rebuild
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./tests:/app/tests

# =============================================================================
# Configuración del pipeline: Catálogo de Encuentros Cercanos entre Asteroides
# =============================================================================
# Este archivo controla TODOS los parámetros del pipeline. No hardcodear valores
# en el código; agregarlos aquí y leerlos vía src/utils/config.py
#
# Para corridas locales personalizadas, copiar a config.local.yaml (gitignored).
# =============================================================================


# -----------------------------------------------------------------------------
# Metadata del run
# -----------------------------------------------------------------------------
run:
  name: "default"                    # Identificador del run (usado en paths de output)
  description: "Corrida estándar del pipeline"
  seed: 42                           # Seed para reproducibilidad


# -----------------------------------------------------------------------------
# Paths de datos
# -----------------------------------------------------------------------------
paths:
  data_root: "./data"
  raw: "./data/raw"                  # Datos descargados crudos
  cache: "./data/cache"              # Computaciones intermedias cacheadas
  output: "./data/output"            # Catálogo final
  logs: "./logs"


# -----------------------------------------------------------------------------
# Fuentes de datos externas
# -----------------------------------------------------------------------------
sources:
  mpcorb:
    url: "https://www.minorplanetcenter.net/iau/MPCORB/MPCORB.DAT.gz"
    local_filename: "MPCORB.DAT"
    refresh_days: 30                 # Re-descargar si la copia local es más vieja

  gaia_sso:
    # Selector de release Gaia. Cambiar este flag arrastra tabla, epoca de
    # referencia, ventana temporal y mp_max (ver bloque 'releases').
    release: "dr3"                     # "dr3" | "fpr"
    archive_url: "https://gea.esac.esa.int/tap-server/tap"
    batch_size: 50000                  # number_mp values per TAP job — dense ranges (mp 1-100) have ~22k rows, sparse (mp 150k+) ~4.5k rows; stays under server result-file limit
    n_workers: 10                     # sequential downloads — avoids concurrent job race conditions on the Gaia TAP server
    max_retries: 10                   # retry attempts per failed batch (exponential backoff: 30s, 60s, 120s)
    columns:                         # Subset de columnas base (compartidas; cada release puede dropear)
      - solution_id
      - source_id
      - denomination
      - number_mp
      - transit_id
      - observation_id
      - epoch
      - epoch_utc
      - ra
      - dec
      - g_mag
      - x_gaia
      - y_gaia
      - z_gaia
    # Metadata especifica por release. Solo difiere lo que esta acoplado al
    # release; el resto (archive_url, batch, columnas base) es compartido.
    releases:
      dr3:
        table: "gaiadr3.sso_observation"
        epoch_ref_jd_tcb: 2455197.5      # epoch = JD_TCB - este (dias desde J2010.0 TCB)
        window_start: "2014-07-25T00:00:00"
        window_end:   "2017-05-28T00:00:00"
        mp_max: 160000
        columns_drop: []                 # DR3 tiene todas las columnas base
      fpr:
        # Ver docs/gaia_fpr_data_model.md (probe Stage 0, 2026-06-01)
        table: "gaiafpr.sso_observation"
        epoch_ref_jd_tcb: 2455197.5      # identica a DR3 (confirmado en el probe)
        window_start: "2014-07-26T00:00:00"
        window_end:   "2020-01-21T00:00:00"  # ~65.8 meses, casi 2x DR3
        mp_max: 400000                   # mp_max real = 399961
        columns_drop: ["g_mag"]          # FPR no incluye fotometria en sso_observation
        reject_flag_column: "is_rejected"  # la capa de masas filtra astrometria rechazada

  gaia_orbits:
    archive_url: "https://gea.esac.esa.int/tap-server/tap"
    batch_size: 5000                  # number_mp values per TAP job
    n_workers: "auto"                 # "auto" = min(cpu_count, 8)
    max_retries: 3

  jpl_horizons:
    api_url: "https://ssd.jpl.nasa.gov/api/horizons.api"
    rate_limit_seconds: 1.0          # Mínimo entre queries (cortesía)

  fienga_2003:
    # Catálogo de predicciones de encuentros asteroide-asteroide
    # Fienga et al. (2003) A&A 406, 751 — disponible vía VizieR
    # Tabla A.1: multiple gravitational events 2003-2022 (>50 mas, ground-based)
    # Tabla A.3: single gravitational events 2003-2022 (>50 mas)
    # Tabla A.4: multiple gravitational events 2010-2022 (1-50 mas, space-based)
    vizier_catalog: "J/A+A/406/751"
    output_filename: "fienga_2003_encounters.parquet"

  goffin_2014:
    # Encuentros usados para determinación de masas de asteroides.
    # Goffin E. (2014) "New determination of asteroid masses" A&A 565, A56.
    # DOI: 10.1051/0004-6361/201322766 — VizieR catalog: J/A+A/565/A56
    vizier_catalog: "J/A+A/565/A56"
    output_filename: "goffin_2014_encounters.parquet"

  galad_2002:
    # Catálogo de encuentros asteroide-asteroide candidatos para determinación
    # de masas. Galád A., Gray B. (2002) A&A 391, 1115.
    # NO está en VizieR — las 7 tablas están embebidas en el HTML del artículo.
    # Tabla 1: encuentros con (1) Ceres
    # Tabla 2: encuentros con (4) Vesta
    # Tabla 3: encuentros con (2) Pallas
    # Tablas 4–5: encuentros con (10) Hygiea (antes/después de 2000)
    # Tablas 6–7: otros perturbadores grandes (antes de 1980 / 1980–1997)
    source_url: "https://www.aanda.org/articles/aa/full/2002/33/aah3376/aah3376.right.html"
    output_filename: "galad_2002_encounters.parquet"


# -----------------------------------------------------------------------------
# Subset de asteroides a procesar
# -----------------------------------------------------------------------------
subset:
  only_numbered: true                # Solo asteroides con número MPC asignado
  max_asteroids: null                # null = todos. Poner un int para tests rápidos
  exclude_neas: false                # Si true, excluye NEAs (sus órbitas requieren más cuidado)
  semimajor_axis_au:                 # Filtro adicional por semieje mayor
    min: 1.5                         # Limitar al cinturón principal por default
    max: 4.0


# -----------------------------------------------------------------------------
# Ventana temporal de análisis
# -----------------------------------------------------------------------------
time_window:
  # Por default cubre todo el período de Gaia DR3
  start: "2014-07-25T00:00:00"       # UTC, ISO 8601
  end:   "2017-05-28T00:00:00"
  scale: "utc"                       # Escala del input. Se convierte a TDB internamente.


# -----------------------------------------------------------------------------
# Propagación orbital
# -----------------------------------------------------------------------------
propagation:
  method: "kepler"                   # "kepler" (rápido, 2 cuerpos) o "rebound" (preciso, N-cuerpos)
  time_step_hours: 1.0               # Resolución temporal "fina" (usada por refinement Kepler)
  # Strategy A — Tiered temporal resolution
  # Si está seteado y es > time_step_hours, el bulk N-body cache se construye a
  # este paso (12x menos disco a 12h vs 1h). El KD-tree scan ensancha su query
  # radius para no perder encuentros entre samples coarse, y el refinement
  # vuelve al propagador Kepler en una ventana fina alrededor de cada candidato.
  # null = comportamiento original (bulk cache al fine step).
  coarse_step_hours: 12.0
  # Strategy B — On-disk format for the bulk trajectory cache.
  # "zarr"   (default): chunked Blosc-zstd-bitshuffled array (~5× compression on
  #                     float32 trajectories; lazy chunked reads).
  # "memmap" (legacy):  raw float32 .npy memory-mapped from disk.
  cache_format: "zarr"
  reference_frame: "barycentric"     # "barycentric" o "heliocentric"
  cache_results: true                # Guardar grilla propagada en data/cache/

  # Solo aplicable si method = "rebound"
  rebound:
    integrator: "ias15"              # Integrador adaptativo de alta precisión
    include_planets:                 # Cuerpos perturbadores a incluir
      - "sun"
      - "mercury"
      - "venus"
      - "earth"
      - "mars"
      - "jupiter"
      - "saturn"
      - "uranus"
      - "neptune"
    include_major_asteroids: false   # Incluir Ceres/Vesta/Pallas/Hygiea como perturbadores


# -----------------------------------------------------------------------------
# Detección de encuentros
# -----------------------------------------------------------------------------
detection:
  threshold_au: 0.05                 # Umbral de distancia (clave!)
  # Cota conservadora de velocidad relativa inter-asteroide (km/s) usada para
  # ensanchar el query radius del KD-tree cuando el bulk cache es coarse.
  # ~25 km/s cubre con margen el subset MBA (a∈[1.5,4.0]).
  max_relative_velocity_km_s: 25.0
  prefilter:
    enabled: true                    # Filtrar pares incompatibles antes del KD-tree
    semimajor_diff_max_au: 0.5       # Pares con |Δa| mayor a esto se descartan
    inclination_diff_max_deg: 30.0   # Idem para inclinación

  kdtree:
    leaf_size: 30                    # Parámetro de scipy.spatial.cKDTree

  refinement:
    enabled: true                    # Refinar candidatos con sub-grid temporal
    # Default subido de 60 → 120 s tras validación contra el catálogo
    # baseline (mismos 72.2 M encuentros, top-10 idéntico, gates OK,
    # drift máx |Δdist|=8.5e-8 AU ≈ 12 km — varios órdenes por debajo de
    # la precisión astrométrica de cualquier asteroide).  ~2× menos trabajo
    # Kepler en el refinamiento.  Bajar a 60 s sólo si se necesita
    # precisión sub-µAU en el tiempo del encuentro (no requerida para
    # detección a 0.05 AU).
    fine_time_step_seconds: 120.0
    # Semiancho de la ventana fina alrededor de cada sample grueso. DEBE ser
    # ≥ coarse_step_hours/2 (validado en src/detect/pipeline.py): con la
    # ventana de 2.0 h bajo grilla de 12 h, ~60 % del catálogo congelado
    # pre-2026-07 quedó con la época recortada en el borde de ventana y la
    # distancia sesgada hacia arriba (hallazgo B1 del tribunal 2026-07-04).
    # El refinador además re-centra iterativamente si el argmin cae en borde.
    window_hours: 6.0


# -----------------------------------------------------------------------------
# Caracterización de encuentros
# -----------------------------------------------------------------------------
characterize:
  compute_relative_velocity: true    # |v1 - v2| en el encuentro
  compute_phase_angle: true          # Para visibilidad desde Gaia
  estimate_diameters: true           # Medidos (SBDB) > H+albedo medido > H+albedo por zona > H+default
  default_albedo: 0.14               # Fallback final cuando no hay ni albedo ni semieje
  # Tabla de diámetros/albedos medidos (descargar con
  # scripts.ingest.download_sbdb_physical). B3 del tribunal: sin esto, Ceres
  # sale con 763 km en vez de 939. null = degradar a albedo por zona.
  physical_data: "data/raw/sbdb_physical.parquet"


# -----------------------------------------------------------------------------
# Paralelización
# -----------------------------------------------------------------------------
parallel:
  enabled: true
  n_workers: "auto"                  # "auto" = os.cpu_count(), o un entero específico
  backend: "multiprocessing"         # "multiprocessing" o "dask"
  chunk_size_days: 30                # Bloques temporales por worker


# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
output:
  format: "parquet"                  # "parquet" (recomendado) o "csv"
  filename: "encounters_catalog"     # Sin extensión
  compression: "zstd"                # Solo aplicable a parquet
  include_metadata: true             # Adjuntar config y versiones en un sidecar


# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  level: "INFO"                      # DEBUG | INFO | WARNING | ERROR
  format: "rich"                     # "rich" (colores en terminal) o "plain"
  file_logging: true                 # Además de stdout, guardar en logs/run_{name}.log
  show_progress_bars: true           # tqdm para loops largos


# -----------------------------------------------------------------------------
# Validación
# -----------------------------------------------------------------------------
validation:
  known_pairs:                       # Pares que el pipeline DEBE detectar (regression test)
    - perturber: 1                   # (1) Ceres
      test: 11                       # (11) Parthenope - encuentro documentado
    - perturber: 4                   # (4) Vesta
      test: 17                       # (17) Thetis
    - perturber: 2                   # (2) Pallas
      test: 23                       # (23) Thalia

  compare_with_jpl: false            # Si true, querea JPL Horizons para los top-N encuentros
  jpl_validation_top_n: 10           # Cantidad de encuentros a validar
